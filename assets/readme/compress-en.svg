<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 304" width="740" height="304" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <title id="t">Tokens resent per request</title>
  <desc id="d">Tokens resent per request before and after compressing, in three real chats: 146 messages · Claude 523k → 65k; 96 messages · Codex 205k → 30k; 40 messages · Claude 653k → 61k</desc>
  <style>
    .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
    .grid { stroke: #e1e0d9; stroke-width: 1; } .base { stroke: #c3c2b7; stroke-width: 1; }
    .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .num { font-variant-numeric: tabular-nums; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
      .grid { stroke: #2c2c2a; } .base { stroke: #383835; }
      .s1 { fill: #3987e5; } .s2 { fill: #d95926; }
    }
  </style>
  <text class="ink" x="0" y="20" font-size="16" font-weight="600">Tokens resent per request</text>
  <text class="ink2" x="0" y="40">Before: average. After: maximum.</text>
