  <text class="ink2 num" x="222.42857142857144" y="111">65k</text>
  <text class="ink" x="158" y="165" text-anchor="end">96 messages · Codex</text>
  <path class="s1" d="M170,142h142.42857142857144a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-142.42857142857144z"><title>96 messages · Codex · Before compressing: 205k</title></path>
