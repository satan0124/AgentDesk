  <rect class="s2" x="330" y="52" width="12" height="12" rx="2"/><text class="ink2" x="348" y="62">After compressing</text>
  <line class="base" x1="170" x2="170" y1="72" y2="278"/><text class="muted num" x="170" y="294" text-anchor="middle">0</text>
  <line class="grid" x1="312.8571428571429" x2="312.8571428571429" y1="72" y2="278"/><text class="muted num" x="312.8571428571429" y="294" text-anchor="middle">200k</text>
  <line class="grid" x1="455.7142857142857" x2="455.7142857142857" y1="72" y2="278"/><text class="muted num" x="455.7142857142857" y="294" text-anchor="middle">400k</text>
  <line class="grid" x1="598.5714285714286" x2="598.5714285714286" y1="72" y2="278"/><text class="muted num" x="598.5714285714286" y="294" text-anchor="middle">600k</text>
  <text class="ink" x="158" y="101" text-anchor="end">146 messages · Claude</text>
